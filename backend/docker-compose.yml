version: "3.8"

services:
  secrets-service:
    build: .
    networks:
      - coolify
    environment:
      - PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-10}
      - RATE_LIMIT_GLOBAL_PER_MINUTE=${RATE_LIMIT_GLOBAL_PER_MINUTE:-120}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio.rule=Host(`portfolio.merrill-api.com`)
      - traefik.http.routers.portfolio.entrypoints=http
      - traefik.http.services.portfolio.loadbalancer.server.port=8080

networks:
  coolify:
    external: true
