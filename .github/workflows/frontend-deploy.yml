name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["frontend/**"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment even if no frontend changes"
        required: false
        default: "false"

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        # No credentials or API keys are passed to the build: every
        # NEXT_PUBLIC_* value is inlined into the public bundle.
        env:
          NEXT_PUBLIC_SECRETS_SERVICE_URL: ${{ vars.NEXT_PUBLIC_SECRETS_SERVICE_URL || 'https://portfolio.merrill-api.com' }}
          # Set explicitly so a failed content fetch fails the build instead of
          # silently shipping the local fixture data.
          NEXT_PUBLIC_POCKETBASE_URL: ${{ vars.NEXT_PUBLIC_POCKETBASE_URL || 'https://data.merrill-api.com' }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./frontend/out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Create deployment summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Frontend Deployment Successful!

          ## 📋 Deployment Details
          - **Environment**: GitHub Pages
          - **URL**: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})
          - **Commit**: \`${{ github.sha }}\`
          - **Branch**: \`${{ github.ref_name }}\`

          ## 🔗 Application Links
          - **Live Site**: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})
          - **Repository**: [GitHub Repository](https://github.com/${{ github.repository }})

          ## ⚙️ Build Configuration
          - **Backend URL**: \`${{ vars.NEXT_PUBLIC_SECRETS_SERVICE_URL || 'https://portfolio.merrill-api.com' }}\`
          - **Node.js Version**: 22
          - **Build Tool**: Next.js (static export)

          ## 🛠 Local Development
          \`\`\`bash
          cd frontend
          npm install
          npm run dev
          \`\`\`
          EOF

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    permissions: {}

    steps:
      - name: Notify on success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Frontend deployment completed successfully!"
          # Add Slack/Discord/Email notification here if needed

      - name: Notify on failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Frontend deployment failed!"
          # Add failure notification here if needed
          exit 1
