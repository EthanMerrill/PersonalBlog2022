name: Backend CI

# Tests the chat API. Production deploys are handled by Coolify, which builds
# backend/dockerfile via backend/docker-compose.yml; nothing here deploys.

on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [master]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Go Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build application
        run: go build -o bin/secrets-service .
